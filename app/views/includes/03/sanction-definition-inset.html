<div class="govuk-inset-text govuk-!-margin-top-0 govuk-!-margin-bottom-8">
  <p class="govuk-body govuk-!-margin-bottom-2">Someone gets a sanction if they:</p>

  <ul class="govuk-list govuk-list--bullet govuk-!-margin-bottom-0">
    <li>are convicted by a court and given a sentence (such as a fine, community order, discharge or prison)</li>
    <li>accept a formal caution from the police</li>
  </ul>
</div>

<details class="govuk-details govuk-!-margin-top-0 govuk-!-margin-bottom-4 violent-offence-check-details violent-offence-check-details--no-button" id="violent-offence-check">
  <summary class="govuk-details__summary">
    <span class="govuk-details__summary-text">Check if an offence is classed as violent</span>
  </summary>
  <div class="govuk-details__text">
    <div class="violent-offence-check violent-offence-check--no-button" data-module="violent-offence-check" data-violent-offence-check-no-button="true">
      <p class="govuk-body govuk-!-margin-top-0 govuk-!-margin-bottom-4" id="violent-offence-check-hint">Search for an offence to check if you should count it as a violent offence.</p>

      <div class="violent-offence-check__search-row" data-violent-check-search>
        <div
          class="offence-autocomplete offence-autocomplete--check offence-autocomplete--check-full-width offence-autocomplete--with-search-button"
          data-module="offence-search"
          data-offence-search-check="true"
          data-offence-search-suggest-violent-tags="true"
          data-offence-search-describedby="violent-offence-check-hint"
          data-offence-search-results-url="a1r"
          data-offence-search-results-context="violent-offence-check"
          id="violent-offence-check-search"
        >
          <div data-offence-search-panel>
            <div class="offence-autocomplete__search-row">
              <div class="govuk-form-group offence-autocomplete__combobox govuk-!-margin-bottom-0">
                <label class="govuk-label govuk-visually-hidden" for="violent-offence-check-search-input">
                  Search for an offence to check if you should count it as a violent offence.
                </label>
                <textarea
                  class="govuk-input offence-autocomplete__input"
                  id="violent-offence-check-search-input"
                  name="q"
                  form="violent-offence-check-search-form"
                  rows="1"
                  spellcheck="false"
                  autocomplete="off"
                  role="combobox"
                  aria-autocomplete="list"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                  aria-controls="violent-offence-check-search-listbox"
                  aria-describedby="violent-offence-check-hint"
                  data-offence-search-input
                ></textarea>
                <ul
                  id="violent-offence-check-search-listbox"
                  class="offence-autocomplete__menu"
                  role="listbox"
                  data-offence-search-listbox
                  hidden
                ></ul>
              </div>
              <button
                type="submit"
                form="violent-offence-check-search-form"
                class="govuk-button offence-autocomplete__search-button"
                data-offence-search-submit
                data-module="govuk-button"
              >Search</button>
            </div>
          </div>
        </div>
      </div>

      <div class="violent-offence-check__selected-section govuk-!-margin-top-4" data-violent-check-selected-section hidden role="region" aria-label="Offence check result">
        <div class="govuk-visually-hidden" data-violent-check-live-region role="status" aria-live="polite" aria-atomic="true"></div>
        <div class="violent-offence-check__selected-list" data-violent-check-selected-list></div>
      </div>

      <template data-violent-check-item-template>
        <div class="violent-offence-check__selected-item" data-violent-check-item>
          <p class="govuk-visually-hidden" data-violent-check-sr-summary></p>
          <div class="violent-offence-check__selected-row" aria-hidden="true" data-violent-check-item-label>
            <span class="violent-offence-check__selected-name" data-violent-check-item-name></span>
            <span class="violent-offence-check__selected-code predictors-offence-code" data-violent-check-item-code></span>
            <span class="violent-offence-check__selected-type">
              <strong class="govuk-tag violent-offence-check__selected-tag" data-offence-violent-tag hidden></strong>
            </span>
          </div>
        </div>
      </template>
    </div>
  </div>
</details>

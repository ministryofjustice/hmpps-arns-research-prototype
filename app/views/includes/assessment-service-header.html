{# Set serviceHeaderTitle and optional serviceHeaderHint before including #}
<div class="govuk-grid-row assessment-service-header">
  <div class="govuk-grid-column-full">
    <h2 class="govuk-heading-l govuk-!-margin-bottom-2">{{ serviceHeaderTitle | default("Tiering assessment") }}</h2>
    {% if serviceHeaderHint %}
      <p class="govuk-hint govuk-!-margin-top-0 govuk-!-margin-bottom-4">{{ serviceHeaderHint }}</p>
    {% endif %}
    <hr class="govuk-section-break govuk-section-break--l govuk-section-break--visible">
  </div>
</div>

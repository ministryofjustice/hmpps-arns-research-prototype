<div class="govuk-form-group">
  <fieldset class="govuk-fieldset" role="group">
    <legend class="govuk-fieldset__legend govuk-fieldset__legend--s govuk-!-font-weight-regular">
      Enter expected end date (optional)
    </legend>
    <div class="govuk-date-input" id="{{ endDateId }}">
      <div class="govuk-date-input__item">
        <div class="govuk-form-group">
          <label class="govuk-label govuk-date-input__label" for="{{ endDateId }}-day">Day</label>
          <input class="govuk-input govuk-date-input__input govuk-input--width-2" id="{{ endDateId }}-day" name="{{ endDateId }}-day" type="text" inputmode="numeric" autocomplete="off">
        </div>
      </div>
      <div class="govuk-date-input__item">
        <div class="govuk-form-group">
          <label class="govuk-label govuk-date-input__label" for="{{ endDateId }}-month">Month</label>
          <input class="govuk-input govuk-date-input__input govuk-input--width-2" id="{{ endDateId }}-month" name="{{ endDateId }}-month" type="text" inputmode="numeric" autocomplete="off">
        </div>
      </div>
      <div class="govuk-date-input__item">
        <div class="govuk-form-group">
          <label class="govuk-label govuk-date-input__label" for="{{ endDateId }}-year">Year</label>
          <input class="govuk-input govuk-date-input__input govuk-input--width-4" id="{{ endDateId }}-year" name="{{ endDateId }}-year" type="text" inputmode="numeric" autocomplete="off">
        </div>
      </div>
    </div>
  </fieldset>
</div>

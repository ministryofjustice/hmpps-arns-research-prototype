version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      development:
        dependency-type: "development"
    ignore:
      - dependency-name: "@types/node"
        versions:
          - ">=23"
      - dependency-name: "applicationinsights"
        versions:
          - ">= 3.0.0"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"